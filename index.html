<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Na mieście</title>
<meta name="description" content="Przewodnik po mieście: restauracje, noclegi, rozrywka, relaks, zwiedzanie i zakupy">
<meta name="theme-color" content="#0b0909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Na mieście">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="docspacer" aria-hidden="true"></div>
<div class="app" id="app">
  <div class="splash" id="splash">
    <div class="splash-bg" id="splashBg"></div>
    <div class="splash-inner">
      <img src="img/logo.png" alt="" class="splash-logo">
      <h1 class="splash-title">NA MIEŚCIE</h1>
      <p class="splash-sub">ODKRYJ MIEJSCA,<br>KTÓRE WARTO ODWIEDZIĆ</p>
    </div>
    <div class="splash-bar"><span></span></div>
  </div>
  <main id="view" class="view"></main>
  <section class="mapwrap" id="mapwrap" hidden>
    <div id="map"></div>
    <div class="map-top"><span class="map-pill" id="mapCount"></span><button class="map-fbtn" id="mapFbtn"><i data-ico="sliders"></i>Filtry<b id="mapFn" hidden></b></button></div>
    <div class="msheet" id="msheet"></div>
    <button class="map-loc" id="mapLoc" aria-label="Moja lokalizacja"><i data-ico="navi"></i></button>
  </section>
  <nav class="tabbar" id="tabbar">
    <a href="#/restauracje" data-tab="home"><i data-ico="cloche"></i><span>Odkrywaj</span></a>
    <a href="#/kuchnie" data-tab="kuchnie"><i data-ico="cutlery"></i><span>Kuchnie</span></a>
    <a href="#/mapa" data-tab="mapa"><i data-ico="map"></i><span>Mapa</span></a>
    <a href="#/filtry" data-tab="filtry"><i data-ico="sliders"></i><span>Filtry</span></a>
    <a href="#/ulubione" data-tab="ulubione"><i data-ico="heart"></i><span>Ulubione</span></a>
  </nav>
  <div class="viewer" id="viewer" hidden></div>
</div>
<script src="app.js"></script>
<script src="kat.js"></script>
<script src="nocl.js"></script>
<script src="rozr.js"></script>
<script src="relaks.js"></script>
<script src="zwiedzanie.js"></script>
<script src="zakupy.js"></script>
</body>
</html>
